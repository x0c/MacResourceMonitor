name: MacResourceMonitor

options:
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SHZQ3MWP3B
    CURRENT_PROJECT_VERSION: 40
    MARKETING_VERSION: 1.1.4
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"
  MacKit:
    url: https://github.com/x0c/mac-kit-swift
    from: "0.1.4"

fileGroups:
  - Configuration
  - README.md
  - README.zh-CN.md
  - AGENTS.md
  - CLAUDE.md
  - LICENSE
  - docs
  - design

targets:
  MacResourceMonitor:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: MacResourceMonitor
        excludes:
          - AppIcon.icon
          - "AppIcon.icon/**"
    resources:
      - path: MacResourceMonitor/AppIcon.icon
    entitlements:
      path: MacResourceMonitor/MacResourceMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.caozc.MacResourceMonitor
        PRODUCT_MODULE_NAME: MacResourceMonitor
        PRODUCT_NAME: Mac Resource Monitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MacResourceMonitor/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mac Resource Monitor
        INFOPLIST_KEY_CFBundleName: Mac Resource Monitor
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 x0c. Released under the MIT License."
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: MacKit
        product: MacKitCore
      - package: MacKit
        product: MacKitLaunchAtLogin
      - package: MacKit
        product: MacKitLifecycle
      - package: MacKit
        product: MacKitOverlay
      - package: MacKit
        product: MacKitUpdater

  MacResourceMonitorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - MacResourceMonitorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.caozc.MacResourceMonitor.tests
        PRODUCT_NAME: MacResourceMonitorTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mac Resource Monitor.app/Contents/MacOS/Mac Resource Monitor
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: MacResourceMonitor
      - package: MacKit
        product: MacKitCore

schemes:
  MacResourceMonitor:
    build:
      targets:
        MacResourceMonitor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MacResourceMonitorTests
    analyze:
      config: Debug
    archive:
      config: Release
